                        <h3 className="table-title">Danh Sách Quản Trị Viên & Nhân Sự Nội Bộ</h3>

                        </p>
                    </div>
                    <div className="room-filter-bar">
                        <input
                            type="text"
                            className="search-input"
                            placeholder="Tìm tên nhân viên..."
                            value={searchVal}
                            onChange={e => setSearchVal(e.target.value)}
                        />
                        <select
                            className="search-input"
                            style={{ width: '190px' }}
                            value={filterRoleId}
                            onChange={e => setFilterRoleId(e.target.value)}
                        >
                            <option value="ALL">Tất cả vai trò</option>
                            {rolesConfig.map(r => (
                                <option key={r.id} value={r.id}>{r.name}</option>
                            ))}
                        </select>
                        {canManageStaff && (
                            <button className="btn btn-sm btn-gold" onClick={onOpenAddStaffModal}>
                                <i className="fa-solid fa-user-plus"></i> Thêm Nhân Viên Mới
                            </button>
                        )}
                    </div>
                </div>

                <div className="data-table-wrap">
                    <table className="data-table">
                        <thead>
                            <tr>
                                <th>Mã NV / Họ Tên</th>
                                <th>Email & Số Điện Thoại</th>
                                <th>Vai Trò (Role)</th>
                                <th>Đăng Nhập Cuối</th>

                                return (
                                    <tr key={s.id}>

                                                    {s.name.charAt(0)}

                                                <div>
                                                    <strong style={{ color: 'var(--navy-dark)' }}>{s.name}</strong>
                                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontFamily: 'monospace' }}>

                    </table>
                </div>

                                                return (
                                                    <td key={r.id} style={{ textAlign: 'center' }}>
                                                        <input
                                                            type="checkbox"
                                                            className="perm-checkbox"
                                                            checked={isChecked}
                                                            onChange={() => onPermissionToggle(r.id, perm.key)}
                                                        />
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                </React.Fragment>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    );
}

function AuthModal({ onClose, onLoginSuccess, onRegisterSuccess }) {
    const [authTab, setAuthTab] = useState('login');
    const [loginUsername, setLoginUsername] = useState('');
    const [loginPassword, setLoginPassword] = useState('');

    // Register State
    const [regFullName, setRegFullName] = useState('');
    const [regPhone, setRegPhone] = useState('');
    const [regEmail, setRegEmail] = useState('');
    const [regDob, setRegDob] = useState('1995-05-15');
    const [regGender, setRegGender] = useState('Nam');
    const [regNationality, setRegNationality] = useState('Việt Nam');
    const [regAddress, setRegAddress] = useState('');
    const [regCccdNumber, setRegCccdNumber] = useState('');
    const [regCccdDate, setRegCccdDate] = useState('2021-08-20');
    const [regCccdPlace, setRegCccdPlace] = useState('Cục CSQLHC về TTXH');
    const [regFrontImg, setRegFrontImg] = useState(DEFAULT_CCCD_FRONT);
    const [regBackImg, setRegBackImg] = useState(DEFAULT_CCCD_BACK);
    const [regPassword, setRegPassword] = useState('');

    const handleFileUpload = (e, setter) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = ev => setter(ev.target.result);
            reader.readAsDataURL(file);
        }
    };

    const handleLoginSubmit = e => {
        e.preventDefault();
        onLoginSuccess({
            username: loginUsername,
            password: loginPassword
        });
    };

    const handleRegisterSubmit = e => {
        e.preventDefault();
        onRegisterSuccess({
            username: regEmail,
            name: regFullName.toUpperCase(),
            phone: regPhone,
            email: regEmail,
            dob: regDob,
            gender: regGender,
            nationality: regNationality,
            address: regAddress,
            cccd: regCccdNumber,
            cccdDate: regCccdDate,
            cccdPlace: regCccdPlace,
            cccdFront: regFrontImg,
            cccdBack: regBackImg,
            role: 'customer',
            avatar: regFullName.charAt(0).toUpperCase()
        });
    };

    return (
        <div className="modal-overlay" style={{ display: 'flex' }}>
            <div className="modal-card modal-lg">
                <div className="modal-header">
                    <h3>{authTab === 'login' ? 'Đăng Nhập Grand Hotel' : 'Đăng Ký Thành Viên VIP (Định Danh CCCD)'}</h3>

                        <button
                            className={`auth-tab-btn ${authTab === 'login' ? 'active' : ''}`}
                            onClick={() => setAuthTab('login')}
                        >
                            Đăng Nhập

                        <button
                            className={`auth-tab-btn ${authTab === 'register' ? 'active' : ''}`}

function CustomerProfileModal({ currentUser, onClose, onUpdateProfileSuccess }) {
    const [name, setName] = useState(currentUser?.name || '');

    const [cccdDate, setCccdDate] = useState(currentUser?.cccdDate || '2021-08-20');

// 4. CLIENT BOOKING MODAL
function BookingModal({ room, currentUser, onClose, onSubmitBooking }) {
    if (!room) return null;

    const todayStr = new Date().toISOString().split('T')[0];
    const tomorrowStr = new Date(Date.now() + 86400000).toISOString().split('T')[0];

    const [customerName, setCustomerName] = useState(currentUser?.name || '');
    const [phone, setPhone] = useState(currentUser?.phone || '');
    const [cccd, setCccd] = useState(currentUser?.cccd || '079095001234');
    const [dob, setDob] = useState(currentUser?.dob || '1995-05-15');
    const [checkIn, setCheckIn] = useState(todayStr);
    const [checkOut, setCheckOut] = useState(tomorrowStr);
    const [breakfast, setBreakfast] = useState(true);
    const [pickup, setPickup] = useState(false);
    const [spa, setSpa] = useState(false);
    const [depositPercent, setDepositPercent] = useState('50');
    const [paymentMethod, setPaymentMethod] = useState('VietQR');

    let nights = 1;
    if (checkIn && checkOut) {
        const diff = new Date(checkOut) - new Date(checkIn);
        nights = Math.ceil(diff / (1000 * 60 * 60 * 24));
        if (nights <= 0) nights = 1;
    }

    const roomPriceTotal = room.price * nights;
    let addonTotal = 0;
    if (breakfast) addonTotal += 200000 * nights;
    if (pickup) addonTotal += 450000;
    if (spa) addonTotal += 600000;
    const grandTotal = roomPriceTotal + addonTotal;

    const depPct = parseInt(depositPercent, 10);
    const depositNeeded = Math.round((grandTotal * depPct) / 100);

    const handleSubmit = e => {
        e.preventDefault();
        const selectedAddons = [];
        if (breakfast) selectedAddons.push('Buffet Sáng Michelin');
        if (pickup) selectedAddons.push('Đưa Đón Sân Bay');
        if (spa) selectedAddons.push('Lotus Spa');

        onSubmitBooking({
            room,
            customerName: customerName.toUpperCase(),
            phone,
            cccd,
            dob,
            checkIn,
            checkOut,
            nights,
            addons: selectedAddons,
            grandTotal,
            depositNeeded,
            paymentMethod
        });
    };

    return (
        <div className="modal-overlay" style={{ display: 'flex' }}>
            <div className="modal-card modal-lg">
                <div className="modal-header">
                    <h3>Xác Nhận Đặt Phòng & Đặt Cọc</h3>
                    <button className="modal-close-btn" onClick={onClose}>&times;</button>
                </div>
                <div className="modal-body">
                    <form onSubmit={handleSubmit}>
                        <div style={{ display: 'flex', gap: '20px', alignItems: 'center', marginBottom: '24px', paddingBottom: '18px', borderBottom: '1px solid var(--border-color)' }}>
                            <img src={room.image} alt={room.name} style={{ width: '120px', height: '85px', borderRadius: '10px', objectFit: 'cover' }} />
                            <div>
                                <span className="room-type">{room.type.toUpperCase()}</span>
                                <h4 style={{ fontSize: '1.3rem', color: 'var(--navy-dark)' }}>{room.name} (Phòng {room.id})</h4>
                                <div style={{ fontSize: '0.9rem', color: 'var(--gold-dark)', fontWeight: 700 }}>
                                    {formatVND(room.price)} / đêm
                                </div>
                            </div>
                        </div>

                        <div className="form-row">
                            <div className="form-group">
                                <label><i className="fa-regular fa-user"></i> Tên Quý Khách</label>
                                <input type="text" required value={customerName} onChange={e => setCustomerName(e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label><i className="fa-solid fa-phone"></i> Số Điện Thoại</label>
                                <input type="tel" required placeholder="09xxxxxxxxx" value={phone} onChange={e => setPhone(e.target.value)} />
                            </div>
                        </div>

                        <div className="form-row">
                            <div className="form-group">
                                <label><i className="fa-regular fa-id-card"></i> Số CCCD / Hộ Chiếu (Để đăng ký tạm trú)</label>
                                <input type="text" required placeholder="0790xxxxxxx" value={cccd} onChange={e => setCccd(e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label><i className="fa-regular fa-calendar"></i> Ngày Sinh</label>
                                <input type="date" required value={dob} onChange={e => setDob(e.target.value)} />
                            </div>
                        </div>

                        <div className="form-row">

// 6. CHECKOUT BILLING MODAL
function CheckoutModal({ room, booking, onClose, onFinalizeCheckout }) {
    if (!room) return null;

    const [method, setMethod] = useState('VietQR');
    const [cashGiven, setCashGiven] = useState('');

    const nights = booking?.nights || 1;
    const roomTotal = room.price * nights;
    const minibar = 150000;
    const grandTotal = (booking?.totalAmount ? booking.totalAmount : roomTotal) + minibar;
    const depositPaid = booking?.depositAmount || 0;
    const remaining = Math.max(0, grandTotal - depositPaid);

    const change = Math.max(0, (parseFloat(cashGiven) || 0) - remaining);

    const handleConfirm = () => {
        onFinalizeCheckout({
            room,
            booking,
            remaining,
            method

                                <input type="email" placeholder="long.vu@grandhotel.vn" required value={email} onChange={e => setEmail(e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label>Số Điện Thoại</label>
                                <input type="tel" placeholder="0912 345 678" required value={phone} onChange={e => setPhone(e.target.value)} />
                            </div>
                        </div>
                        <div className="form-row">
                            <div className="form-group">
                                <label>Phân Gán Vai Trò (Role)</label>
                                <select value={roleId} onChange={e => setRoleId(e.target.value)}>
                                    {rolesConfig.map(r => (
                                        <option key={r.id} value={r.id}>{r.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="form-group">
                                <label>Trạng Thái Tài Khoản</label>
                                <select value={status} onChange={e => setStatus(e.target.value)}>
                                    <option value="active">Đang hoạt động</option>
                                    <option value="locked">Tạm khóa</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" className="btn btn-gold" style={{ width: '100%', marginTop: '10px' }}>
                            <i className="fa-solid fa-user-check"></i> Lưu Thông Tin Nhân Sự
                        </button>
                    </form>
                </div>
            </div>
        </div>
    );
}

// 11. NEW ROLE MODAL
function NewRoleModal({ onClose, onCreateRole }) {
    const [name, setName] = useState('');
    const [id, setId] = useState('');
    const [color, setColor] = useState('#0284c7');
    const [desc, setDesc] = useState('');

    const handleSubmit = e => {
        e.preventDefault();
        onCreateRole({
            id: id.toLowerCase().replace(/\s+/g, '_'),
            name,
            badgeColor: color,
            description: desc || name
        });
    };

    return (
        <div className="modal-overlay" style={{ display: 'flex' }}>
            <div className="modal-card">
                <div className="modal-header">
                    <h3>Tạo Vai Trò Chức Danh Mới</h3>
                    <button className="modal-close-btn" onClick={onClose}>&times;</button>
                </div>
                <div className="modal-body">
                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label>Tên Vai Trò (Chức Danh)</label>
                            <input type="text" placeholder="VD: Quản Lý F&B Nhà Hàng" required value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div className="form-row">
                            <div className="form-group">
                                <label>Mã Vai Trò (ID không dấu)</label>
                                <input type="text" placeholder="VD: fnb_manager" required value={id} onChange={e => setId(e.target.value)} />
                            </div>
                            <div className="form-group">
                                <label>Màu Sắc Nhận Diện</label>
                                <input type="color" value={color} onChange={e => setColor(e.target.value)} style={{ height: '48px', padding: '4px' }} />
                            </div>
                        </div>
                        <div className="form-group">
                            <label>Mô Tả Nhiệm Vụ</label>
                            <textarea rows="2" placeholder="Mô tả phạm vi trách nhiệm của vai trò..." value={desc} onChange={e => setDesc(e.target.value)}></textarea>
                        </div>
                        <button type="submit" className="btn btn-gold" style={{ width: '100%', marginTop: '10px' }}>
                            <i className="fa-solid fa-plus"></i> Khởi Tạo Vai Trò Mới
                        </button>
                    </form>
                </div>
            </div>
        </div>
    );
}


        // ====================================================================
        // ROOT COMPONENT & MOUNT
        // ====================================================================
        /**
 * ============================================================================
 * ROOT APPLICATION VIEW: App.jsx
 * ============================================================================
 * Tuân thủ nghiêm ngặt mô hình kiến trúc MVC (Model - View - Controller).
 * App.jsx đóng vai trò kết nối bộ điều khiển useHotelController với các View hiển thị:
 * - Landing Page Views: Navbar, Hero, LandingRooms, Footer
 * - Admin Panel Views: Sidebar, Topbar, Dashboard, Rooms, Bookings, Ledger, Staff, Permissions
 * - Interactive Dialogs: ModalsView
 * - Feedback View: ToastView
 */


// Views


function App() {
    const ctrl = useHotelController();
    const [isSidebarOpen, setIsSidebarOpen] = React.useState(false);

    return (
        <div className="grand-hotel-react-app">
            <ToastView toasts={ctrl.toasts} />

            {ctrl.viewMode === 'landing' ? (
                <div id="landing-view">
                    <NavbarView
                        currentUser={ctrl.currentUser}
                        onOpenAuthModal={() => ctrl.openModal('auth')}
                        onOpenCustomerProfile={() => ctrl.openModal('customerProfile')}
                        onOpenMyBookings={() => ctrl.openModal('myBookings')}
                        onEnterAdmin={() => ctrl.handleSetViewMode('admin')}
                        onLogout={ctrl.handleLogout}
                    />

                    <HeroView
                        searchParams={ctrl.searchParams}
                        setSearchParams={ctrl.setSearchParams}
                        onSearch={ctrl.handleSearch}
                    />

                    <LandingRoomsView
                        rooms={ctrl.rooms}
                        currentFilter={ctrl.currentFilter}
                        onFilterChange={ctrl.setCurrentFilter}
                        onBookRoom={ctrl.handleBookRoomClick}
                    />

                    <FooterView />
                </div>
            ) : (
                <div id="admin-view" style={{ display: 'block' }}>
                    <div className="admin-layout">
                        <div
                            className={`admin-sidebar-backdrop ${isSidebarOpen ? 'active' : ''}`}
                            onClick={() => setIsSidebarOpen(false)}
                        />

                        <AdminSidebarView
                            adminTab={ctrl.adminTab}
                            isSidebarOpen={isSidebarOpen}
                            onCloseSidebar={() => setIsSidebarOpen(false)}
                            onTabChange={ctrl.handleTabChange}
                            onViewCustomerLanding={() => ctrl.setViewMode('landing')}
                            onResetDemoData={ctrl.handleResetDemoData}
                            checkPermission={ctrl.checkPermission}
                        />

                        <main className="admin-content">
                            <AdminTopbarView
                                title={ADMIN_TAB_TITLES[ctrl.adminTab] || 'Quản Trị'}
                                staffUsers={ctrl.staffUsers}
                                rolesConfig={ctrl.rolesConfig}
                                activeStaffId={ctrl.activeStaffId}
                                currentUser={ctrl.currentUser}
                                onNavigateTab={tab => ctrl.setAdminTab(tab)}
                                onSwitchActiveStaff={id => {
                                    ctrl.setActiveStaffId(id);
                                    ctrl.addToast(
                                        'Chuyển vai trò thành công',
                                        `Đang thao tác với tư cách: ${ctrl.staffUsers.find(s => s.id === id)?.name}`,
                                        'info'
                                    );
                                }}
                                onLogout={ctrl.handleLogout}
                                onToggleSidebar={() => setIsSidebarOpen(prev => !prev)}
                            />

                            <div className="admin-body">
                                {ctrl.adminTab === 'dashboard' && (
                                    <DashboardView
                                        rooms={ctrl.rooms}
                                        bookings={ctrl.bookings}
                                        transactions={ctrl.transactions}
                                        historicalRevenue={ctrl.historicalRevenue}
                                        checkPermission={ctrl.checkPermission}
                                        onNavigateTab={tab => ctrl.setAdminTab(tab)}
                                        addToast={ctrl.addToast}
                                    />
                                )}

                                {ctrl.adminTab === 'rooms-management' && (
                                    <RoomsView
                                        rooms={ctrl.rooms}
                                        checkPermission={ctrl.checkPermission}
                                        onOpenNewRoomModal={() => ctrl.openModal('newRoom')}
                                        onQuickCheckIn={ctrl.handleQuickCheckIn}
                                        onConfirmCheckIn={ctrl.handleConfirmCheckIn}
                                        onOpenCheckoutModal={ctrl.handleOpenCheckoutModal}
                                        onCompleteCleaning={ctrl.handleCompleteCleaning}
                                    />
                                )}

                                {ctrl.adminTab === 'bookings-management' && (
                                    <BookingsView
                                        bookings={ctrl.bookings}
                                        checkPermission={ctrl.checkPermission}
                                        onQuickWalkInBooking={() => ctrl.handleQuickCheckIn('101')}
                                        onOpenCccdView={b => ctrl.openModal('adminCccdView', b)}
                                        onConfirmCheckIn={ctrl.handleConfirmCheckIn}
                                        onOpenCheckoutModal={ctrl.handleOpenCheckoutModal}
                                        onCancelBooking={ctrl.handleCancelBooking}
                                    />
                                )}

                                {ctrl.adminTab === 'financial-ledger' && (
                                    <LedgerView
                                        transactions={ctrl.transactions}
                                        bookings={ctrl.bookings}
                                        checkPermission={ctrl.checkPermission}
                                        onOpenManualTxModal={() => ctrl.openModal('manualTx')}
                                    />
                                )}

                                {ctrl.adminTab === 'users-management' && (
                                    <StaffView
                                        staffUsers={ctrl.staffUsers}
                                        rolesConfig={ctrl.rolesConfig}
                                        checkPermission={ctrl.checkPermission}
                                        onOpenAddStaffModal={() => ctrl.openModal('staff')}
                                        onOpenEditStaffModal={s => ctrl.openModal('staff', { staff: s })}
                                        onToggleStaffStatus={ctrl.handleToggleStaffStatus}
                                        onDeleteStaffUser={ctrl.handleDeleteStaffUser}
                                    />
                                )}

                                {ctrl.adminTab === 'permissions-config' && (
                                    <PermissionsView
                                        rolesConfig={ctrl.rolesConfig}
                                        permissionGroups={PERMISSION_GROUPS}
                                        onPermissionToggle={ctrl.handlePermissionToggle}
                                        onOpenNewRoleModal={() => ctrl.openModal('newRole')}
                                        onResetRolesMatrix={ctrl.handleResetRolesMatrix}
                                        onSavePermissions={ctrl.handleSavePermissions}
                                    />
                                )}
                            </div>
                        </main>
                    </div>
                </div>
            )}

            <ModalsView
                activeModal={ctrl.activeModal}
                modalData={ctrl.modalData}
                onCloseModal={ctrl.closeModal}
                currentUser={ctrl.currentUser}
                onLoginSuccess={ctrl.handleLoginSuccess}
                onRegisterSuccess={ctrl.handleRegisterSuccess}
                onUpdateProfileSuccess={ctrl.handleUpdateProfileSuccess}
                onSubmitBooking={ctrl.handleSubmitBooking}
                onConfirmQrPaid={ctrl.handleConfirmQrPaid}
                onFinalizeCheckout={ctrl.handleFinalizeCheckout}
                onCreateManualTx={ctrl.handleCreateManualTx}
                onCreateRoom={ctrl.handleCreateRoom}
                onSaveStaff={ctrl.handleSaveStaff}
                onCreateRole={ctrl.handleCreateRole}
                bookings={ctrl.bookings}
                rooms={ctrl.rooms}
                rolesConfig={ctrl.rolesConfig}
            />
        </div>
    );
}


        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
